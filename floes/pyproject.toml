[project]
name = "floes"
version = "0.1.0"
description = "Lightweight observational sea-ice analysis and monthly PyGMT figure generation."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "netCDF4",
]

[project.optional-dependencies]
plotting = ["pygmt"]
dask = ["dask"]

[tool.ruff]
line-length = 120
